<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="300" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7;#8b5cf6;#10b981;#0284c7" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#10b981;#0284c7;#8b5cf6" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981;#0284c7;#8b5cf6;#10b981" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Animated Shimmer Title Gradient -->
    <linearGradient id="titleShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#c084fc;#34d399;#38bdf8" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#34d399;#38bdf8;#818cf8" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#38bdf8;#c084fc;#34d399" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .name-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 38px; font-weight: 900; letter-spacing: -1px; fill: url(#titleShimmer); }
    .subtitle-lead { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #f1f5f9; }
    .subtitle-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; fill: #94a3b8; font-weight: 500; }
    .badge-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11.5px; font-weight: 700; fill: #f8fafc; }
    .status-badge-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 800; fill: #34d399; letter-spacing: 0.5px; }

    @keyframes radarPulse {
      0% { r: 4px; opacity: 1; }
      50% { r: 7px; opacity: 0.4; }
      100% { r: 4px; opacity: 1; }
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .radar { animation: radarPulse 2s infinite ease-in-out; }
    .cursor { animation: cursorBlink 0.9s infinite; fill: #38bdf8; }
  </style>

  <!-- Background Base with Rounded Corners -->
  <rect x="2" y="2" width="896" height="296" rx="18" fill="url(#cyberBg)" stroke="url(#borderGlow)" stroke-width="1.8" />
  <rect x="2" y="2" width="896" height="296" rx="18" fill="url(#grid)" />

  <!-- Top Status Bar -->
  <path d="M 2 20 Q 2 2 20 2 L 880 2 Q 898 2 898 20 L 898 44 L 2 44 Z" fill="#0f172a" opacity="0.85" />
  <line x1="2" y1="44" x2="898" y2="44" stroke="#1e293b" stroke-width="1" />

  <!-- Mac Window Dots -->
  <circle cx="28" cy="23" r="6" fill="#ef4444" />
  <circle cx="48" cy="23" r="6" fill="#eab308" />
  <circle cx="68" cy="23" r="6" fill="#22c55e" />

  <!-- Window Header Title -->
  <text x="450" y="27" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b" font-weight="600">
    ⚡ USAMA HASSAN // SENIOR MERN STACK ARCHITECT // flovoa.portfolio.com
  </text>

  <!-- Live Status Badge (Top Right) -->
  <g transform="translate(685, 13)">
    <rect x="0" y="0" width="195" height="22" rx="11" fill="#064e3b" opacity="0.7" stroke="#059669" stroke-width="1" />
    <circle cx="14" cy="11" r="5" fill="#34d399" class="radar" />
    <text x="28" y="15" class="status-badge-text">SENIOR DEV • ACTIVE</text>
  </g>

  <!-- Main Hero Content -->
  <text x="40" y="98" class="name-title">USAMA HASSAN</text>

  <text x="40" y="136" class="subtitle-lead">
    <tspan fill="#38bdf8">⚡</tspan> Senior Full-Stack &amp; MERN Stack Engineer
    <tspan class="cursor">_</tspan>
  </text>

  <text x="40" y="168" class="subtitle-sub">
    Architecting robust, high-performance web systems • 3+ Years of Battle-Tested Production Engineering
  </text>

  <!-- Senior Capability Chips Row -->
  <!-- Chip 1 -->
  <g transform="translate(40, 205)">
    <rect x="0" y="0" width="126" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="16" cy="17" r="5" fill="#38bdf8" />
    <text x="30" y="21" class="badge-text">React.js / TS</text>
  </g>

  <!-- Chip 2 -->
  <g transform="translate(176, 205)">
    <rect x="0" y="0" width="128" height="34" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.2" />
    <circle cx="16" cy="17" r="5" fill="#22c55e" />
    <text x="30" y="21" class="badge-text">Node / Express</text>
  </g>

  <!-- Chip 3 -->
  <g transform="translate(314, 205)">
    <rect x="0" y="0" width="128" height="34" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
    <circle cx="16" cy="17" r="5" fill="#10b981" />
    <text x="30" y="21" class="badge-text">MongoDB / SQL</text>
  </g>

  <!-- Chip 4 -->
  <g transform="translate(452, 205)">
    <rect x="0" y="0" width="138" height="34" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="16" cy="17" r="5" fill="#f59e0b" />
    <text x="30" y="21" class="badge-text">REST &amp; Auth APIs</text>
  </g>

  <!-- Chip 5 -->
  <g transform="translate(600, 205)">
    <rect x="0" y="0" width="144" height="34" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" />
    <circle cx="16" cy="17" r="5" fill="#8b5cf6" />
    <text x="30" y="21" class="badge-text">High Performance</text>
  </g>

  <!-- Chip 6 -->
  <g transform="translate(754, 205)">
    <rect x="0" y="0" width="106" height="34" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" />
    <circle cx="16" cy="17" r="5" fill="#ec4899" />
    <text x="30" y="21" class="badge-text">3+ Yrs Exp</text>
  </g>

  <!-- Footer Accent Line -->
  <line x1="20" y1="262" x2="880" y2="262" stroke="#1e293b" stroke-width="1" />
</svg>
