<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="320" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="chartBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#05070E" />
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="barFrontend" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="barBackend" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="barDatabase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="barPerf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="barTools" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
  </defs>

  <style>
    .header-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 800; fill: #f8fafc; letter-spacing: 0.5px; }
    .skill-title { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 700; fill: #e2e8f0; }
    .skill-sub { font-family: 'Segoe UI', sans-serif; font-size: 11.5px; fill: #94a3b8; }
    .skill-pct { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 800; fill: #38bdf8; }

    @keyframes barLoad1 { from { width: 0; } to { width: 520px; } }
    @keyframes barLoad2 { from { width: 0; } to { width: 495px; } }
    @keyframes barLoad3 { from { width: 0; } to { width: 480px; } }
    @keyframes barLoad4 { from { width: 0; } to { width: 505px; } }
    @keyframes barLoad5 { from { width: 0; } to { width: 510px; } }

    .bar-1 { animation: barLoad1 1.2s ease-out forwards; }
    .bar-2 { animation: barLoad2 1.4s ease-out forwards; }
    .bar-3 { animation: barLoad3 1.6s ease-out forwards; }
    .bar-4 { animation: barLoad4 1.8s ease-out forwards; }
    .bar-5 { animation: barLoad5 2.0s ease-out forwards; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="916" height="316" rx="14" fill="url(#chartBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Header -->
  <text x="32" y="36" class="header-text">📊 CORE ENGINEERING PROFICIENCY &amp; TECHNICAL DOMAINS</text>
  <line x1="32" y1="48" x2="888" y2="48" stroke="#1e293b" stroke-width="1" />

  <!-- Skill 1: Frontend -->
  <g transform="translate(32, 65)">
    <text x="0" y="14" class="skill-title">🎨 Frontend &amp; UI Architecture</text>
    <text x="0" y="28" class="skill-sub">React.js, TypeScript, JavaScript (ES6+), HTML5, CSS3, Bootstrap</text>
    <!-- Background track -->
    <rect x="320" y="8" width="480" height="14" rx="7" fill="#1e293b" />
    <!-- Active Bar -->
    <rect x="320" y="8" width="460" height="14" rx="7" fill="url(#barFrontend)" class="bar-1" />
    <text x="815" y="20" class="skill-pct">96%</text>
  </g>

  <!-- Skill 2: Backend -->
  <g transform="translate(32, 115)">
    <text x="0" y="14" class="skill-title">⚙️ Backend &amp; RESTful APIs</text>
    <text x="0" y="28" class="skill-sub">Node.js, Express.js, PHP, REST APIs, Routing &amp; Middleware</text>
    <!-- Background track -->
    <rect x="320" y="8" width="480" height="14" rx="7" fill="#1e293b" />
    <!-- Active Bar -->
    <rect x="320" y="8" width="445" height="14" rx="7" fill="url(#barBackend)" class="bar-2" />
    <text x="815" y="20" class="skill-pct" fill="#22c55e">93%</text>
  </g>

  <!-- Skill 3: Database -->
  <g transform="translate(32, 165)">
    <text x="0" y="14" class="skill-title">🗄️ Database &amp; Data Modeling</text>
    <text x="0" y="28" class="skill-sub">MongoDB (Mongoose ODM), MySQL, Query Optimization &amp; Indexing</text>
    <!-- Background track -->
    <rect x="320" y="8" width="480" height="14" rx="7" fill="#1e293b" />
    <!-- Active Bar -->
    <rect x="320" y="8" width="430" height="14" rx="7" fill="url(#barDatabase)" class="bar-3" />
    <text x="815" y="20" class="skill-pct" fill="#10b981">90%</text>
  </g>

  <!-- Skill 4: Security & Performance -->
  <g transform="translate(32, 215)">
    <text x="0" y="14" class="skill-title">⚡ Security &amp; Performance</text>
    <text x="0" y="28" class="skill-sub">JWT/OAuth Auth, Validation, Caching, Responsive Web Optimization</text>
    <!-- Background track -->
    <rect x="320" y="8" width="480" height="14" rx="7" fill="#1e293b" />
    <!-- Active Bar -->
    <rect x="320" y="8" width="455" height="14" rx="7" fill="url(#barPerf)" class="bar-4" />
    <text x="815" y="20" class="skill-pct" fill="#f59e0b">95%</text>
  </g>

  <!-- Skill 5: Tooling & DevOps -->
  <g transform="translate(32, 265)">
    <text x="0" y="14" class="skill-title">🛠️ Toolchain &amp; Engineering</text>
    <text x="0" y="28" class="skill-sub">Git, GitHub, Chrome DevTools, Postman, Debugging &amp; Cross-Browser</text>
    <!-- Background track -->
    <rect x="320" y="8" width="480" height="14" rx="7" fill="#1e293b" />
    <!-- Active Bar -->
    <rect x="320" y="8" width="450" height="14" rx="7" fill="url(#barTools)" class="bar-5" />
    <text x="815" y="20" class="skill-pct" fill="#a855f7">94%</text>
  </g>
</svg>
