<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="100%" height="260" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #a855f7; #34d399; #38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7; #34d399; #38bdf8; #a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .terminal-title { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 13px; fill: #64748b; font-weight: 600; }
    .main-name { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 34px; font-weight: 900; letter-spacing: -0.5px; fill: url(#textGrad); }
    .role-text { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 16px; font-weight: 600; fill: #e2e8f0; }
    .accent-role { fill: #38bdf8; font-weight: 700; }
    .sub-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 13.5px; fill: #94a3b8; font-weight: 500; }
    .tag-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; fill: #f8fafc; }
    .status-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; fill: #10b981; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.3; }
    }
    .cursor { animation: blink 1s infinite; fill: #38bdf8; }
    .pulse-dot { animation: pulseGlow 2s infinite ease-in-out; }
  </style>

  <!-- Outer Card Background with Border -->
  <rect x="2" y="2" width="856" height="256" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Terminal Top Bar Background -->
  <path d="M 2 18 Q 2 2 18 2 L 842 2 Q 858 2 858 18 L 858 38 L 2 38 Z" fill="#0f172a" opacity="0.9" />
  <line x1="2" y1="38" x2="858" y2="38" stroke="#1e293b" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="24" cy="20" r="5.5" fill="#ef4444" />
  <circle cx="42" cy="20" r="5.5" fill="#eab308" />
  <circle cx="60" cy="20" r="5.5" fill="#22c55e" />

  <!-- Terminal Title -->
  <text x="430" y="24" text-anchor="middle" class="terminal-title">usamahassan@mern-architect: ~ /portfolio (flovoa.portfolio.com)</text>

  <!-- Live Status Badge (Top Right) -->
  <g transform="translate(690, 12)">
    <rect x="0" y="0" width="150" height="18" rx="9" fill="#064e3b" opacity="0.6" stroke="#059669" stroke-width="1" />
    <circle cx="12" cy="9" r="4" fill="#10b981" class="pulse-dot" />
    <text x="24" y="13" class="status-text">AVAILABLE FOR HIRE</text>
  </g>

  <!-- Main Hero Content -->
  <!-- Name -->
  <text x="36" y="85" class="main-name">USAMA HASSAN</text>

  <!-- Dynamic Role Line with Prompt Symbol -->
  <text x="36" y="122" class="role-text">
    <tspan fill="#a855f7">&gt;</tspan> Senior <tspan class="accent-role">MERN Stack Developer</tspan> &amp; Full-Stack Architect
    <tspan class="cursor">_</tspan>
  </text>

  <!-- Mission / Summary Subtitle -->
  <text x="36" y="152" class="sub-text">⚡ 3+ Years Experience &bull; Engineering high-performance web apps, secure REST APIs &amp; intuitive UIs</text>

  <!-- Pill Badges Row -->
  <!-- Badge 1: React -->
  <g transform="translate(36, 185)">
    <rect x="0" y="0" width="92" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8" />
    <text x="30" y="20" class="tag-text">React.js</text>
  </g>

  <!-- Badge 2: Node.js -->
  <g transform="translate(136, 185)">
    <rect x="0" y="0" width="94" height="32" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#22c55e" />
    <text x="30" y="20" class="tag-text">Node.js</text>
  </g>

  <!-- Badge 3: Express -->
  <g transform="translate(238, 185)">
    <rect x="0" y="0" width="102" height="32" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#94a3b8" />
    <text x="30" y="20" class="tag-text">Express.js</text>
  </g>

  <!-- Badge 4: MongoDB -->
  <g transform="translate(348, 185)">
    <rect x="0" y="0" width="100" height="32" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#10b981" />
    <text x="30" y="20" class="tag-text">MongoDB</text>
  </g>

  <!-- Badge 5: TypeScript -->
  <g transform="translate(456, 185)">
    <rect x="0" y="0" width="112" height="32" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#60a5fa" />
    <text x="30" y="20" class="tag-text">TypeScript</text>
  </g>

  <!-- Badge 6: REST APIs -->
  <g transform="translate(576, 185)">
    <rect x="0" y="0" width="105" height="32" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#f59e0b" />
    <text x="30" y="20" class="tag-text">REST APIs</text>
  </g>

  <!-- Badge 7: MySQL -->
  <g transform="translate(689, 185)">
    <rect x="0" y="0" width="90" height="32" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#0284c7" />
    <text x="30" y="20" class="tag-text">MySQL</text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="18" y1="238" x2="842" y2="238" stroke="#1e293b" stroke-width="1" />
</svg>
